version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: samuelkurt-blockhaus_web_1
      APP_PORT: 3000

  web:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    command: ["node", "/app/server.js"]
    environment:
      PORT: 3000
      DATA_DIR: /data
      SERVERS_DIR: /servers
      # Public texture-pack download + Minecraft forwarding (see README, "Texture packs").
      PACK_PORT: 25700
      NODE_ENV: production
    ports:
      # Port 25700, NOT 25566: the Crafty app publishes the whole range 25500-25600 on the host, so a port in it makes
      # `docker compose up` fail with "port is already allocated". Keep this outside that range.
      # Not behind the Umbrel login on purpose: this is what the playit.gg tunnel connects to.
      # It only serves published pack files and forwards Minecraft traffic to Crafty.
      - "25700:25700"
    volumes:
      # The panel's own code (copied here from the store when the app is installed).
      - ${APP_DATA_DIR}/src:/app:ro
      # Settings (Crafty URL, token, addresses). Written as root, mode 600.
      - ${APP_DATA_DIR}/data:/data
      # Crafty's servers folder, so the panel can read/write server.properties,
      # whitelist.json and logs. "denny-crafty" is the app id of the Crafty install.
      - ${UMBREL_ROOT}/app-data/denny-crafty/data/servers:/servers
    # Fallback route to Crafty (https://host.docker.internal:8443) if the container
    # name crafty_container is not resolvable from this app's network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
