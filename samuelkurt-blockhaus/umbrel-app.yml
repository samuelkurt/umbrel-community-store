releaseNotes: >-
  0.8.6: Paper: the Game rules page was empty and the seed missing because Paper 26 keeps both with the overworld (world/dimensions/minecraft/overworld/data/minecraft/) instead of world/data/minecraft/. Both are read from there now, and the rules are written there (the console's /gamerule changes the overworld on Paper). Checked on a real Paper 26.3 server: reading and changing rules (running and stopped), the Nether switch (portal blocked / allowed), the End lock with the way back, the live item check, the seed. Not tried: Purpur, Fabric, Folia. 0.8.5: Anticheat, fewer false alarms. "Moved too quickly" / "moved wrongly": falls (cliff, void) are not counted; a throw upwards (Ender Dragon, explosion), a trip through a nether portal and a /tp excuse the warnings around them (the check now waits a few seconds for the next position sample before it flags); the series length starts at 3 (a stored 1 is raised). Flying: a climb must go on for 4 samples, and a single throw gives a short quiet period. A big jump is no longer reported when the player just died and came back at their bed or the world spawn, and a /tp during a position query no longer shows up as a jump. Checked on a real 26.3 server (portal trip, death and respawn 2500 blocks away, real series of warnings still flagged); not reproduced: the Ender Dragon itself and a real client. 0.8.4: Locked End: players are now sent back to their own respawn point (bed, respawn anchor or /spawnpoint) instead of the world spawn. Without a respawn point, or when the bed is gone, they still go to the world spawn. The chunk of the bed is loaded only for the check; a chunk you keep loaded with /forceload stays loaded. An End lock from an older Blockhaus is updated by itself when the Game rules page is opened. Checked on a real 26.3 server (bed in an unloaded chunk, negative coordinates, bed removed, /spawnpoint, no respawn point, forced chunk kept); not tried: respawn anchor, Nether respawn point, servers before 26 (1.21.x use other data names). 0.8.3: "End betretbar" said the data pack version could not be read from the server.jar (Forge, NeoForge and launchers keep the vanilla jar elsewhere). Blockhaus now writes a pack that every game version from 1.21 on accepts (old fields for 1.21 to 1.21.8 plus min_format/max_format for newer ones) when it cannot read the exact format; the message only remains for versions before 1.21. Checked on a real 26.3 server (loads without a warning, sends the player back from the End); not tried on Forge/NeoForge/1.21.x servers. 0.8.2: Anticheat: swimming up in water was reported as flying. The climb to the surface ends with a jump out of the water, which is open air for a moment, and exactly then the check looked. Every sample of a player who is off the ground is now checked for open air at that moment; one sample in water, on a ladder or in a web cancels a hover or climb verdict, and for 8 s after such a moment nobody is judged. Real hovering and climbing cheats are still found (checked on a real server). It adds one log line per round for a player who is not on the ground. 0.8.1: texture pack download with port forwarding: the download address was built from the public address, which carries the Minecraft port (25565); Java answers nothing for HTTP there, so players could not download the pack ("socket hang up"). Blockhaus now uses the same host with its own pack port (25700 / 25701) when the public address names the Minecraft port; addresses with another port (playit tunnel) and a download address entered by hand stay as they are. The pack port needs its own router forwarding (TCP). "Von außen testen" now says whether the pack server answers on the machine itself (then the forwarding or firewall is missing) or not, and names the Minecraft port as the wrong one. Apply the pack again after updating so the new address is written to server.properties. 0.8.0: new page "Spielregeln" (Minecraft 26 and newer): all game rules of the world as switches and number fields with German names, read from the world file, so it also works with the server stopped (a running server gets the change at once; a stopped one at its next start). Nether: since Minecraft 26 the setting allow-nether no longer exists in server.properties (the switch in Optionen did nothing); it is now the game rule allow_entering_nether_using_portals, and the switch in Optionen and on the new page sets that. Lock the End: Minecraft has no switch for it, so "End betretbar" off puts a small data pack (datapacks/blockhaus_noend) into the world that sends everyone in the End back to the overworld spawn; the tag end_erlaubt exempts a player. Tested on a real 26.3 server only. Anticheat: the page now shows how often the live item check runs and how many lines per hour it writes to latest.log. 0.7.5: Anticheat: illegal items are now found within seconds. Until now the check only read the player files that Minecraft writes every few minutes or when a player leaves, so a spawner given to yourself was noticed only after leaving. The new live check asks the server for inventory, ender chest and armor of every online player every 10 s (setting "Items live prüfen", interval adjustable; creative players and operators stay exempt as before; it adds three lines per player and round to latest.log, not to the console view). 0.7.4: Anticheat self-test: the player is now a text field with a list of online and known players (the old drop-down could not be used for some), and "remove item", kick, warn and the self-test no longer rely on Blockhaus' own player list: if the join line was not recognised, the server is asked whether the player is online (before, the removal was silently only queued). 0.7.3: the panel code now really arrives with every update: the container unpacks hooks/blockhaus-src.tar.gz into a fresh /app at every start (0.7.1/0.7.2 used a host script that lost its executable bit on the way into the store, so umbrelOS skipped it). Delete the old folder samuelkurt-blockhaus-solo/src (and samuelkurt-blockhaus/src is only the development copy) from the store repo. 0.7.2: Anticheat: built-in self-test (pick a player; it places test items, finds them, removes them, checks the slots and measures the response times on your real server). Fixes found while preparing it: servers with another log format (Forge, NeoForge, Fabric, Paper) were not understood at all; buttons waited behind the routine position queries and gave up after 2.5 s; a flagged item that the player had moved in the meantime could not be removed (it is now searched for in the whole inventory); "scan now" waited a fixed 1.5 s instead of for the server to finish saving. 0.7.1: the panel code is now updated together with the app (until now umbrelOS left the code folder at the version of the first install, so updates changed the app version but not the code); Anticheat: warnings now have manual buttons (never automatic): remove the item from the inventory, ender chest or armor slot (checked against the live slot, a copy is kept), warn, kick, ban, move a player back after a big jump, ban an address, disable a mod file. 0.7.0: shared code update. New page "Anticheat" exists only in Blockhaus Solo and on a dedicated server, because it needs Blockhaus to see the Minecraft console; this app (with Crafty) does not show it and is otherwise unchanged. 0.6.0: the panel code now also supports a dedicated Debian server (own login, performance page with watts, terminal in the browser, installer in deploy/debian). All of that is switched off in this app, so it behaves as before; it only ships the shared code and a small xterm.js library. 0.5.0: the panel can now also run Minecraft by itself; that is the new app "Blockhaus Solo" in this store. This app (with Crafty) is unchanged apart from fixes. 0.4.1: fixes the install failing because the pack port 25566 lies inside the port range Crafty publishes (25500-25600); the pack port is now 25700. 0.4.0: Voice Chat page (port and voice_host for playit), "Schneller" tab with performance mods for your loader and version, check and import of a hand-entered texture pack address, second-tunnel option for packs. 0.3.1: software switch can stop and restart a running server; Mods page links to the loaders. 0.3.0 adds texture packs: upload several ZIPs, merge them and serve them to players directly (needs the playit tunnel port set to 25700).
