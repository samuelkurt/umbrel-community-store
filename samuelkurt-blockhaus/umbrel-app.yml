releaseNotes: >-
  0.7.1: Anticheat: warnings now have manual buttons (never automatic): remove the item from the inventory, ender chest or armor slot (checked against the live slot, a copy is kept), warn, kick, ban, move a player back after a big jump, ban an address, disable a mod file. 0.7.0: shared code update. New page "Anticheat" exists only in Blockhaus Solo and on a dedicated server, because it needs Blockhaus to see the Minecraft console; this app (with Crafty) does not show it and is otherwise unchanged. 0.6.0: the panel code now also supports a dedicated Debian server (own login, performance page with watts, terminal in the browser, installer in deploy/debian). All of that is switched off in this app, so it behaves as before; it only ships the shared code and a small xterm.js library. 0.5.0: the panel can now also run Minecraft by itself; that is the new app "Blockhaus Solo" in this store. This app (with Crafty) is unchanged apart from fixes. 0.4.1: fixes the install failing because the pack port 25566 lies inside the port range Crafty publishes (25500-25600); the pack port is now 25700. 0.4.0: Voice Chat page (port and voice_host for playit), "Schneller" tab with performance mods for your loader and version, check and import of a hand-entered texture pack address, second-tunnel option for packs. 0.3.1: software switch can stop and restart a running server; Mods page links to the loaders. 0.3.0 adds texture packs: upload several ZIPs, merge them and serve them to players directly (needs the playit tunnel port set to 25700).
