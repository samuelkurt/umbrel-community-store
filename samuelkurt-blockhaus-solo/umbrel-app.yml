releaseNotes: >-
  0.7.4: Anticheat self-test: the player is now a text field with a list of online and known players (the old drop-down could not be used for some), and "remove item", kick, warn and the self-test no longer rely on Blockhaus' own player list: if the join line was not recognised, the server is asked whether the player is online (before, the removal was silently only queued). 0.7.3: the panel code now really arrives with every update: the container unpacks hooks/blockhaus-src.tar.gz into a fresh /app at every start (0.7.1/0.7.2 used a host script that lost its executable bit on the way into the store, so umbrelOS skipped it). Delete the old folder samuelkurt-blockhaus-solo/src (and samuelkurt-blockhaus/src is only the development copy) from the store repo. 0.7.2: Anticheat: built-in self-test (pick a player; it places test items, finds them, removes them, checks the slots and measures the response times on your real server). Fixes found while preparing it: servers with another log format (Forge, NeoForge, Fabric, Paper) were not understood at all; buttons waited behind the routine position queries and gave up after 2.5 s; a flagged item that the player had moved in the meantime could not be removed (it is now searched for in the whole inventory); "scan now" waited a fixed 1.5 s instead of for the server to finish saving. 0.7.1: the panel code is now updated together with the app (until now umbrelOS left the code folder at the version of the first install, so updates changed the app version but not the code); Anticheat: warnings now have manual buttons (never automatic): remove the item from the inventory, ender chest or armor slot (checked against the live slot, a copy is kept), warn, kick, ban, move a player back after a big jump, ban an address, disable a mod file. 0.7.0: new page "Anticheat". It only watches and reports, it never kicks, bans or warns anyone: impossible items (command blocks, bedrock, spawners, enchantments above vanilla maximum, also inside shulker boxes), speed and flying checks for online players, chat spam, connection floods, x-ray statistics, and optional allow-lists for mods/plugins and the server's texture pack. Warnings show on the page and as a counter in the menu. Operators are exempt by default. Not possible server-side: client detection (client brand), reach, killaura and other packet-level cheats. 0.6.0: the panel code now also supports a dedicated Debian server (own login, performance page with watts, terminal in the browser, installer in deploy/debian). All of that is switched off in this app, so it behaves as before; it only ships the shared code and a small xterm.js library. 0.5.0: first release. Same panel as Blockhaus, but it runs Minecraft itself (no Crafty Controller): create or take over servers, automatic Java download, start/stop with clean shutdown, optional autostart.
